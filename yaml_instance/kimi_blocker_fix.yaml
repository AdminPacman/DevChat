graph:
  id: kimi_blocker_fix
  description: >-
    TASK-03 swarm blocker fixes — dispatching the EXISTING brief
    (~/dev/kimi/inbox/TASK-03-swarm-gate-blockers.md) to Kimi through the crew console, so
    the work happens where Pac can watch it and rule on it.

    Route: Seed (deterministic clone + 25-patch stack, no LLM) -> Kimi fixes the 3 blockers
    -> deterministic patch generation -> Claude gates it (tsc + eslint + per-blocker
    verification) -> bounded repair -> PAC'S APPROVAL (human) -> package instructions.

    ⚠️ LAUNCH FROM THE CONSOLE (http://localhost:5173). `type: human` blocks properly only in
    live web-UI/WebSocket runs.

    WHY A CLONE, NOT THE REAL TREE: the standing rule is ONE DELIVERABLE OWNS THE WORKING
    TREE. `~/dev/onecocreation` currently holds 126 uncommitted files (the swarm work), and a
    gate's verdict against a moving tree is worthless — that is what cost the last round. So
    this graph never touches the real repo. It builds its own pristine `--shared` clone at
    59a5dbd, replays the 25 reviewed patches onto it, and delivers patch #26 as a file. The
    clone shares git objects with the parent (cheap, ~35 MB of .git) and symlinks
    node_modules (692 MB, never copied) so `tsc` can actually run.

    VERIFIED BEFORE THIS GRAPH WAS WRITTEN (0018.05.26 a₿): all 25 patches apply clean on
    pristine 59a5dbd producing exactly 126 changed files — matching the working tree — and
    all three blockers are present in the stacked result at the lines the brief names.
  log_level: INFO
  is_majority_voting: false
  nodes:

    # ── 1. SEED — deterministic, no LLM. Clone, stack, brief. ────────────────────────────
    - id: Seed_Script
      type: literal
      description: Fixed Python that builds the stacked clone and stages the brief. No model involved.
      context_window: 0
      config:
        role: user
        content: |-
          ```python
          import os, shutil, subprocess, sys
          from pathlib import Path

          SRC       = Path("/home/pac/dev/onecocreation")
          OUTBOX    = Path("/home/pac/dev/kimi/outbox")
          BRIEF     = Path("/home/pac/dev/kimi/inbox/TASK-03-swarm-gate-blockers.md")
          BASE      = "59a5dbd"
          STACKS    = ["task-03-p1", "task-03-p2", "task-03-time", "task-03-swarm"]
          REPO      = Path("repo")

          def run(args, cwd=None, check=True):
              r = subprocess.run(args, cwd=cwd, capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("CMD FAILED:", " ".join(args)); print(r.stderr[:600]); sys.exit(1)
              return r

          if REPO.exists():
              shutil.rmtree(REPO)

          # --shared: reuse the parent's git objects instead of copying them.
          run(["git", "clone", "--shared", "--quiet", str(SRC), str(REPO)])
          run(["git", "checkout", "--quiet", BASE], cwd=REPO)

          dirty = run(["git", "status", "--porcelain"], cwd=REPO).stdout.strip()
          print("clone at", BASE, "- pristine:" , "yes" if not dirty else "NO (unexpected)")

          # node_modules is 692 MB. Symlink it so tsc/eslint work without copying.
          link = REPO / "node_modules"
          if not link.exists():
              os.symlink(SRC / "node_modules", link)
          print("node_modules symlinked:", link.is_dir())

          applied, failed = [], []
          for stack in STACKS:
              for patch in sorted((OUTBOX / stack).glob("*.patch")):
                  r = run(["git", "apply", "--whitespace=nowarn", str(patch)],
                          cwd=REPO, check=False)
                  (applied if r.returncode == 0 else failed).append(f"{stack}/{patch.name}")
                  if r.returncode != 0:
                      print("PATCH FAILED:", stack, patch.name, r.stderr[:200])

          print(f"patches applied: {len(applied)}  failed: {len(failed)}")
          changed = run(["git", "status", "--porcelain"], cwd=REPO).stdout.strip().splitlines()
          print("changed files:", len(changed), "(expected 126)")

          # Record the exact pre-fix state so patch generation later is a clean diff.
          run(["git", "add", "-A"], cwd=REPO)
          run(["git", "-c", "user.email=crew@pacsarcade", "-c", "user.name=Crew Console",
               "commit", "--quiet", "-m", "stacked: 25 reviewed patches (pre-blocker-fix baseline)"],
              cwd=REPO)
          head = run(["git", "rev-parse", "HEAD"], cwd=REPO).stdout.strip()
          Path("BASELINE_SHA").write_text(head, encoding="utf-8")
          print("baseline commit:", head[:12])

          shutil.copy(BRIEF, "TASK.md")
          print("brief staged: TASK.md", Path("TASK.md").stat().st_size, "bytes")

          # ── Instructions go ON DISK, not through a model. ──────────────────────────────
          # Learned 0018.05.26: a delegating node's ONLY job must be a tiny tool call. When
          # the long instruction lived in the node's role text, the 30B choreography model
          # (a) paraphrased it — Claude was told "read these files" instead of
          # "verify and write REVIEW.md", so it analysed correctly and wrote nothing — and
          # (b) saw the shell commands described in that text and tried to call `bash` and
          # `read` ITSELF, tools that node does not have, spraying "Tool call bash for node
          # Gate" errors and looping 5 times at ~$0.45 a pass. Text a model must relay is
          # text a model will rewrite. Files are not paraphrasable.

          Path("BUILD_INSTRUCTIONS.md").write_text('''# Builder instructions — read this whole file, then do it

          Read `TASK.md` in this directory. It is a gate report listing three BLOCKERS and
          four should-fix items. The repo is cloned at `./repo` with 25 reviewed patches
          already applied. **Work only inside `./repo`.**

          Fix all three blockers exactly as TASK.md specifies:

          1. `src/components/rooms/RoomsShelf.tsx` — the group accents were changed to
             `var()` values, but lines ~151/152/158 append hex-alpha to them
             (`${g.accent}55`), which is invalid CSS and drops the whole declaration. The
             pill border, background and divider must render again. Make all four accent
             rows consistent with each other.
          2. `src/lib/cart-reminders.ts` and `src/lib/gift-vouchers.ts` — each has a
             JSX-style comment `{/* ... */}` inside an HTML template literal, which ships as
             VISIBLE TEXT in a customer email. Delete them, then grep every template literal
             under `src/lib` for the same pattern to be certain none remain.
          3. `src/app/cartridge.css` (~line 236) — `#classes .lockpill` uses a theme-aware
             token on a card pinned to the same background in both themes, destroying
             contrast. Restore a pinned value.

          Then do items 4-7 from TASK.md if they are quick, and state plainly which you did
          and which you skipped.

          Do NOT touch anything TASK.md's "Cleared" section says is already fine. Do not
          reformat, make no unrelated edits, and change as few lines as possible.

          When done, write `FIX_NOTES.md` in the PARENT directory (not inside `repo/`):
          per blocker, exactly what you changed and why, plus your answer to item 5's
          gold-law question.
          '''.replace("\n          ", "\n"), encoding="utf-8")

          Path("GATE_INSTRUCTIONS.md").write_text('''# Gate instructions — read this whole file, then do it

          You are gating a fix for three blockers. Read `TASK.md` (the original gate report)
          and `FIX_NOTES.md` (the builder's account) in this directory. The edited repo is
          `./repo`; the generated patch is `./11-swarm-blocker-fixes.patch`.

          ⚠️ Your shell's working directory PERSISTS between Bash calls. Do not repeat
          `cd repo` — either `cd` once and stay, or prefer `git -C repo ...` and paths like
          `repo/src/...` from this directory. Repeated `cd repo` will fail with
          "No such file or directory" once you are already inside it.

          ## Verify each blocker YOURSELF against real file contents. Never trust FIX_NOTES.md.
          - **B1** `repo/src/components/rooms/RoomsShelf.tsx` must no longer produce invalid
            CSS. NOTE: the template strings `${g.accent}55` may legitimately REMAIN — that is
            correct *if* `g.accent` is now a hex literal. It is only a bug when `g.accent` is
            a `var()`. Check what the accents actually are before judging, and confirm all
            four rows are consistent.
          - **B2** No JSX comments inside template literals in `repo/src/lib` — check
            `cart-reminders.ts` and `gift-vouchers.ts` specifically.
          - **B3** `repo/src/app/cartridge.css`'s `#classes .lockpill` colour must be a
            pinned value, not a theme-aware token.

          ## Then compile
          From inside `repo/`: `npx --no-install tsc --noEmit`, then
          `npx --no-install eslint . 2>&1 | tail -20`.
          On the PRE-FIX stacked tree, tsc exits 0 with no errors — so ANY tsc error is a
          regression the builder introduced. The MEASURED eslint baseline on that same
          pre-fix tree is **65 errors / 9 warnings** (verified 0018.05.26; the older brief
          said 65/10 — 9 is the real number). Report the DELTA against 65/9. Delta zero passes.

          ## Then scope-check
          Read the patch and flag any hunk that is not clearly one of B1/B2/B3 or a stated
          should-fix item.

          ## Then WRITE THE FILE — this is the deliverable, not your chat reply
          Write `REVIEW.md` in this directory containing: a per-blocker PASS/FAIL with the
          evidence you actually checked, the tsc result, the eslint delta, and any
          out-of-scope hunks. Anything you could not verify is a FAIL, not a pass.

          The LAST line of REVIEW.md must be exactly one of:
          VERDICT: APPROVE
          VERDICT: NEEDS_WORK

          APPROVE requires: all three blockers pass, tsc clean, no out-of-scope edits.
          End your own reply with that same VERDICT line and nothing after it.
          '''.replace("\n          ", "\n"), encoding="utf-8")

          print("instructions staged:",
                Path("BUILD_INSTRUCTIONS.md").stat().st_size,
                Path("GATE_INSTRUCTIONS.md").stat().st_size, "bytes")

          if failed:
              print("SEED FAILED - do not proceed")
              sys.exit(1)
          print("SEED OK")
          ```

    - id: Seed_Executor
      type: python
      description: Runs Seed_Script verbatim. Deterministic; a non-zero exit means the stack drifted.
      context_window: 0
      log_output: true
      config:
        args: []
        env: {}
        timeout_seconds: 300
        encoding: utf-8

    # ── 2. BUILDER — Kimi fixes the blockers. It reads TASK.md itself. ───────────────────
    - id: Builder
      type: agent
      config:
        name: ${NVIDIA_MODEL_NAME}
        provider: openai
        base_url: ${NVIDIA_BASE_URL}
        api_key: ${NVIDIA_API_KEY}
        role: |-
          You are a dispatcher. You have exactly one tool and you make exactly one call.

          Call `kimi_run` with:
            task: "Read BUILD_INSTRUCTIONS.md in the current working directory and carry it out in full."
            expect_files: true
            timeout_seconds: 1500

          Then reply in ONE sentence: whether ok was true, and which files changed. If ok was
          false, say so plainly and quote the error — never report success the tool did not
          report.

          Do not do the work yourself. Do not read files. Do not run commands. You have no
          tool other than `kimi_run`, and attempting any other tool will error.
        params: {}
        tooling:
          - type: function
            config:
              auto_load: true
              tools:
                - name: kimi_run
        thinking: null
        memories: []
        retry: null
      description: 'Delegates the blocker fixes to Kimi (curated skills pinned, external service).'
      context_window: 4
      log_output: true

    # ── 3. PATCH — deterministic. Kimi's edits become patch #26. ─────────────────────────
    - id: Patch_Script
      type: literal
      description: Fixed Python that turns Kimi's edits into the deliverable patch. No LLM.
      context_window: 0
      config:
        role: user
        content: |-
          ```python
          import subprocess, sys
          from pathlib import Path

          REPO = Path("repo")
          OUT  = Path("11-swarm-blocker-fixes.patch")

          def run(args, cwd=None):
              return subprocess.run(args, cwd=cwd, capture_output=True, text=True)

          status = run(["git", "status", "--porcelain"], cwd=REPO).stdout.strip()
          if not status:
              print("NO CHANGES - Kimi did not edit anything in repo/. Nothing to package.")
              sys.exit(1)

          print("files Kimi touched:")
          for line in status.splitlines():
              print("  ", line)

          diff = run(["git", "diff", "--patch"], cwd=REPO).stdout
          untracked = run(["git", "ls-files", "--others", "--exclude-standard"], cwd=REPO).stdout.split()
          if untracked:
              print("NOTE untracked files (not in diff):", untracked)

          OUT.write_text(diff, encoding="utf-8")
          print("wrote", OUT, OUT.stat().st_size, "bytes")

          # Prove the patch is self-consistent: it must re-apply on the baseline.
          check = run(["git", "stash", "--include-untracked"], cwd=REPO)
          reapply = run(["git", "apply", "--check", str(Path("..") / OUT)], cwd=REPO)
          run(["git", "stash", "pop"], cwd=REPO)
          print("patch re-applies on baseline:", "YES" if reapply.returncode == 0 else "NO " + reapply.stderr[:200])
          print("PATCH OK")
          ```

    - id: Patch_Executor
      type: python
      description: Runs Patch_Script. Exits non-zero if Kimi changed nothing.
      context_window: 0
      log_output: true
      config:
        args: []
        env: {}
        timeout_seconds: 180
        encoding: utf-8

    # ── 4. GATE — Claude verifies. Needs Bash: this is the step that compiles. ───────────
    - id: Gate
      type: agent
      config:
        name: ${NVIDIA_MODEL_NAME}
        provider: openai
        base_url: ${NVIDIA_BASE_URL}
        api_key: ${NVIDIA_API_KEY}
        role: |-
          You are a dispatcher. You have exactly one tool and you make exactly one call.

          Call `claude_run` with:
            task: "Read GATE_INSTRUCTIONS.md in the current working directory and carry it out in full."
            expect_files: true
            timeout_seconds: 900
            allowed_tools: "Read,Write,Edit,Grep,Glob,Bash"

          The tool returns a `final_text` ending in a verdict line. Reply with that verdict in
          two or three sentences, and make your LAST line exactly one of:
          VERDICT: APPROVE
          VERDICT: NEEDS_WORK
          Nothing may follow that line — it is the routing keyword. If the tool returned
          ok: false, or no verdict is present, emit VERDICT: NEEDS_WORK.

          Do not verify anything yourself. Do not read files. Do not run commands. You have no
          tool other than `claude_run`, and attempting any other tool will error.
        params: {}
        tooling:
          - type: function
            config:
              auto_load: true
              tools:
                - name: claude_run
        thinking: null
        memories: []
        retry: null
      description: 'Claude compiles and verifies each blocker; emits the routing verdict.'
      context_window: 6
      log_output: true

    - id: Repair_Loop_Counter
      type: loop_counter
      description: Caps the Builder/Gate repair cycle at 2. Each hop is a real subprocess.
      context_window: 0
      config:
        max_iterations: 2
        reset_on_emit: true
        message: 'Repair cap reached (2 attempts) — sending to Pac flagged as NOT gate-clean rather than burning more crew calls.'

    # ── 5. PAC RULES ────────────────────────────────────────────────────────────────────
    - id: Pac_Approval
      type: human
      description: "Pac's approval gate before the patch is packaged for the outbox."
      context_window: 0
      config:
        description: |-
          BLOCKER FIX READY — your call, Captain.

          Nothing has touched ~/dev/onecocreation. All of this happened in this run's own
          clone; your 126-file working tree is exactly as you left it.

          In the run workspace: REVIEW.md (Claude's gate), FIX_NOTES.md (Kimi's account),
          11-swarm-blocker-fixes.patch (the deliverable), and repo/ (the stacked tree with
          the fixes applied) — plus every crew member's full session stream in _agent_logs/.

          Reply with:
            APPROVE — package the patch to ~/dev/kimi/outbox/task-03-swarm/ as #26
            REJECT  — bin it; say why so it lands in the notes
          or any notes you want carried into packaging.

          Item 5 of the brief needs YOUR ruling either way: `--warn`'s night face is
          byte-identical to `--gold-2`, so surfaces routed to `--warn` paint exact money-gold
          while looking innocent in review. Retune the token, or move those surfaces off it?

    - id: Package
      type: literal
      description: Terminal — Pac has ruled.
      context_window: 0
      config:
        role: assistant
        content: |-
          Crew run closed. The deliverable is 11-swarm-blocker-fixes.patch in this run's
          code_workspace/, alongside REVIEW.md and FIX_NOTES.md.

          On APPROVE, the patch becomes #26 of the stack and the whole 26-patch stack is
          clear to commit onto pristine 59a5dbd on booking-s6. Copy it to
          ~/dev/kimi/outbox/task-03-swarm/ and archive the brief out of the inbox.

          This graph deliberately does NOT write into ~/dev/kimi or ~/dev/onecocreation
          itself — packaging stays a human-initiated step so nothing lands in a fleet
          directory without Pac's hand on it.

  edges:
    - from: Seed_Script
      to: Seed_Executor
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Seed_Executor
      to: Builder
      trigger: true
      condition: 'true'
      carry_data: false
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Builder
      to: Patch_Script
      trigger: true
      condition: 'true'
      carry_data: false
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Patch_Script
      to: Patch_Executor
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Patch_Executor
      to: Gate
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Gate
      to: Pac_Approval
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - 'VERDICT: APPROVE'
          none: []
          regex: []
          case_sensitive: false
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Gate
      to: Builder
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - 'VERDICT: NEEDS_WORK'
          none: []
          regex: []
          case_sensitive: false
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Gate
      to: Repair_Loop_Counter
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - 'VERDICT: NEEDS_WORK'
          none: []
          regex: []
          case_sensitive: false
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Repair_Loop_Counter
      to: Pac_Approval
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Pac_Approval
      to: Package
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
  start:
    - Seed_Script
  end:
    - Package
version: 1.0.0
vars: {}
